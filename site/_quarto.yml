# Quarto site configuration (Phase 7, D12).
# Render: `quarto render site` from the repo root (quarto is in ~/.local/bin).
# The pre-render hook copies static artifacts (dashboards, cost screenshots)
# from their source-of-truth locations; the copies are git-ignored.

project:
  type: website
  output-dir: _site
  pre-render: tools/prerender.sh
  post-render: tools/postrender.sh
  resources:
    - tributary/embedded/*
    - assets/img/*

website:
  title: "Tributary"
  description: "Tributary: a data science case study on a simulated lead marketplace — business questions turned into decisions with identity modeling, calibrated models, and an honestly read experiment, built by directing AI agents under an auditable harness."
  site-url: https://jordanbeary.github.io/tributary/
  favicon: assets/favicon.svg
  repo-url: https://github.com/JordanBeary/tributary
  # An eight-page site with a docked sidebar doesn't need search, and the
  # search stack (fuse + autocomplete) render-blocks every page.
  search: false
  navbar:
    left:
      - href: tributary/index.qmd
        text: "Case study"
    right:
      # Text links, not icons: the github icon alone pulls the 177KB
      # bootstrap-icons font plus a render-blocking stylesheet on every page.
      # The author's profile and resume live on the portfolio site (D15).
      - text: About the author
        href: https://jordanbeary.github.io/
        aria-label: About the author (portfolio site)
      - text: GitHub
        href: https://github.com/JordanBeary/tributary
        aria-label: GitHub repository
  sidebar:
    - id: tributary
      title: "Tributary"
      style: docked
      collapse-level: 1
      contents:
        - href: tributary/index.qmd
          text: Overview
        - href: tributary/silo-problem.qmd
          text: The silo problem
        - href: tributary/cost.qmd
          text: Cost engineering
        - href: tributary/dashboards.qmd
          text: Dashboards
        - href: tributary/method.qmd
          text: How this was built
        - href: tributary/run-it.qmd
          text: Run it yourself
  page-footer:
    center: |
      Static site — every number links to the artifact that produced it.
      [Repository](https://github.com/JordanBeary/tributary) · [About the author](https://jordanbeary.github.io/)

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    toc: true
    link-external-newwindow: true
