version: 2

models:
  - name: int_consumer_entities
    description: "Unification spine: CRM lead -> consumer entity (dedupe cluster) + best-match marketing contact."
    columns:
      - name: lead_id
        tests: [unique, not_null]
      - name: consumer_entity_id
        tests: [not_null]

  - name: int_auction_consumer_map
    description: "Auction lead_uuid -> consumer entity via payload/time linkage; ~95% of lead_uuids resolve (5% are migration orphans by construction)."
    columns:
      - name: lead_uuid
        tests: [unique, not_null]
      - name: crm_lead_id
        tests: [not_null]
