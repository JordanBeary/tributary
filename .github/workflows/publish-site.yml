# Renders the Quarto site and deploys it to GitHub Pages.
#
# Publishes on every push to main so the site tracks the repo (D14, decision
# packet Q-J: flipped 2026-09-21, after the reframed site deployed and the
# human read it). No path filter: the pages draw on sources across the repo
# (dashboards, model reports, the strategy memo, the meta records), and a
# filter that missed one would publish a stale site silently. Manual dispatch
# is kept for re-deploys.
# Requires Pages enabled with source "GitHub Actions" in repo settings.
name: publish-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18   # match the version pinned locally in ~/.local/opt
      # Run the pre-render hook once before Quarto does. Quarto resolves
      # include shortcodes while loading the project, which is before its own
      # pre-render step, so on a clean checkout the strategy memo's git-ignored
      # include target would not exist yet and the render fails (INT-020). The
      # hook is idempotent; Quarto running it again is harmless.
      - run: sh tools/prerender.sh
        working-directory: site
      - run: quarto render site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
